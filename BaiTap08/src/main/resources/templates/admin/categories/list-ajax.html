<%@ page contentType="text/html;charset=UTF-8" %> <%@ taglib
uri="http://java.sun.com/jsp/jstl/core" prefix="c"%>
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Danh sách danh mục</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
	rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
	crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
	<div class="container-fluid py-3">
		<div class="card">
			<div
				class="card-header d-flex justify-content-between align-items-center">
				<h4 class="mb-0">
					<i class="fas fa-list me-2"></i>Danh sách danh mục
				</h4>
				<div class="d-flex gap-2">
					<a href="${pageContext.request.contextPath}/seller/categories/add"
						class="btn btn-primary"> <i class="fas fa-plus me-1"></i> Thêm
						danh mục
					</a> <a
						href="${pageContext.request.contextPath}/seller/categories/search"
						class="btn btn-info"> <i class="fas fa-search me-1"></i> Tìm
						kiếm
					</a>
				</div>
			</div>
			<div class="card-body">
				<table class="table table-striped table-hover">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Icon</th>
							<th>Tên danh mục</th>
							<th>Thao tác</th>
						</tr>
					</thead>
					<tbody>
						<c:forEach var="c" items="${categories}">
							<tr>
								<td>${c.categoryId}</td>
								<td><c:choose>
										<c:when test="${not empty c.images}">
											<img
												src="${pageContext.request.contextPath}/uploads/${c.images}"
												style="width: 70px" />
										</c:when>
										<c:otherwise>
											<span class="text-muted">No icon</span>
										</c:otherwise>
									</c:choose></td>
								<td>${c.categoryName}</td>
								<td><a
									href="${pageContext.request.contextPath}/seller/categories/update?id=${c.categoryId}"
									class="btn btn-sm btn-warning me-1"> <i class="fa fa-edit"></i>
								</a> <a
									href="${pageContext.request.contextPath}/seller/categories/delete?id=${c.categoryId}"
									class="btn btn-sm btn-danger"
									onclick="return confirm('Bạn có chắc muốn xóa?')"> <i
										class="fa fa-trash"></i>
								</a></td>
							</tr>
						</c:forEach>
						<c:if test="${empty categories}">
							<tr>
								<td colspan="4" class="text-center text-muted">Không có dữ
									liệu</td>
							</tr>
						</c:if>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		crossorigin="anonymous"></script>
</body>
</html>
