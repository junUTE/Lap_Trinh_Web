<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">

<head>
  <meta charset="UTF-8">
  <title>Danh sách danh mục (AJAX)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>

<body>
<div layout:fragment="content" class="container-fluid py-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0"><i class="fas fa-list me-2"></i>Danh sách danh mục</h4>
      <button type="button" class="btn btn-primary" onclick="showCreateNewCategoryModal()">
        <i class="fas fa-plus me-1"></i> Thêm danh mục
      </button>
    </div>
    <div class="card-body">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Icon</th>
          <th>Tên danh mục</th>
          <th>Thao tác</th>
        </tr>
        </thead>
        <tbody id="categories-tbody">
        <!-- dữ liệu sẽ được render bằng AJAX -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Thêm Category -->
<div class="modal fade" id="createCategoryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addCategory" method="post" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Thêm danh mục</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="new_categoryname" class="form-label">Tên danh mục</label>
            <input type="text" class="form-control" id="new_categoryname" name="categoryName" required>
          </div>
          <div class="mb-3">
            <label for="new_icon" class="form-label">Icon</label>
            <input type="file" class="form-control" id="new_icon" name="icon">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Lưu</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts -->
<script type="text/javascript">
  const contextPath = '/';

  // Load danh sách Category
  function loadCategories() {
    $.getJSON(contextPath + 'api/category', function (json) {
      console.log("API response:", json);

      // nếu API trả về dạng { success, message, data }
      const categories = Array.isArray(json) ? json : (json.data ? json.data : []);
      let rows = [];

      if (categories.length === 0) {
        rows.push('<tr><td colspan="4" class="text-center text-muted">Không có dữ liệu</td></tr>');
      } else {
        categories.forEach(c => {
          rows.push('<tr>');
          rows.push('<td>' + (c.categoryId ?? '') + '</td>');
          rows.push('<td>' + (c.icon
                  ? '<img src="/uploads/' + c.icon + '" style="width:70px">'
                  : '<span class="text-muted">No icon</span>') + '</td>');
          rows.push('<td>' + (c.categoryName ?? '') + '</td>');
          rows.push('<td>'
                  + '<a href="#" data-id="' + c.categoryId + '" class="btn btn-sm btn-warning me-1 btn-edit"><i class="fa fa-edit"></i></a>'
                  + '<a href="#" data-id="' + c.categoryId + '" class="btn btn-sm btn-danger btn-delete"><i class="fa fa-trash"></i></a>'
                  + '</td>');
          rows.push('</tr>');
        });
      }
      $('#categories-tbody').html(rows.join(''));
    }).fail(function (xhr, status, error) {
      console.error("AJAX error:", status, error);
    });
  }

  // Thêm Category
  $("form#addCategory").submit(function (e) {
    e.preventDefault();
    var formData = new FormData(this);
    $.ajax({
      url: contextPath + 'api/category/addCategory',
      type: 'POST',
      data: formData,
      processData: false,
      contentType: false,
      success: function (res) {
        if (res && res.success) {
          $('#createCategoryModal').modal('hide');
          loadCategories();
        } else {
          alert(res && res.message ? res.message : 'Có lỗi xảy ra');
        }
      },
      error: function () {
        alert("Không thể thêm danh mục");
      }
    });
  });

  // Xóa Category
  $(document).on('click', '.btn-delete', function () {
    const id = $(this).data('id');
    if (!confirm("Bạn có chắc muốn xóa?")) return;
    $.ajax({
      url: contextPath + 'api/category/deleteCategory?categoryId=' + id,
      type: 'DELETE',
      success: function () {
        loadCategories();
      },
      error: function () {
        alert("Xóa thất bại");
      }
    });
  });

  // Hiện modal thêm mới
  function showCreateNewCategoryModal() {
    $('#new_categoryname').val('');
    $('#new_icon').val('');
    $('#createCategoryModal').modal('show');
  }

  $(document).ready(function () {
    loadCategories();
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
