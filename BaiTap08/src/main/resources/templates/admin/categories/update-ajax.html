<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật danh mục (AJAX + GraphQL)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var contextPath = /*[[@{/}]]*/ '/';
        if (contextPath && !contextPath.endsWith('/')) { contextPath = contextPath + '/'; }
        var graphqlEndpoint = contextPath + 'graphql';
        /*]]>*/
    </script>
</head>
<body>
<div layout:fragment="content" class="container py-4">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <i class="fas fa-edit me-2"></i>
            <h5 class="mb-0">Cập nhật danh mục</h5>
        </div>
        <div class="card-body">
            <form id="updateCategoryForm" enctype="multipart/form-data" class="needs-validation" novalidate>
                <input type="hidden" id="categoryId">

                <!-- Tên danh mục -->
                <div class="mb-3">
                    <label class="form-label fw-bold" for="categoryName">
                        <i class="fas fa-tag me-1"></i>Tên danh mục
                    </label>
                    <input class="form-control" id="categoryName" required>
                    <div class="invalid-feedback">Tên danh mục không được để trống</div>
                </div>

                <!-- Hình ảnh hiện tại -->
                <div class="mb-3">
                    <label class="form-label fw-bold">
                        <i class="fas fa-image me-1"></i>Hình ảnh hiện tại
                    </label>
                    <div id="currentImagePreview" class="border rounded p-2 bg-light text-center"></div>
                </div>

                <!-- Upload hình mới -->
                <div class="mb-3">
                    <label class="form-label fw-bold" for="imageFile">
                        <i class="fas fa-upload me-1"></i>Chọn hình ảnh mới (tùy chọn)
                    </label>
                    <input type="file" class="form-control" id="imageFile" accept="image/*">
                    <small class="text-muted">Để trống nếu muốn giữ hình cũ</small>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/admin/categories/ajax/list}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-1"></i>Quay lại
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i>Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) {
            alert('Thiếu id');
            return window.location.href = contextPath + 'admin/categories/ajax/list';
        }

        $('#categoryId').val(id);

        // Load dữ liệu danh mục
        gqlRequest(`query($id: ID!){ categoryById(id: $id){ categoryId categoryName images } }`, {id})
            .then(data => {
                const c = data?.categoryById;
                if (!c) {
                    alert('Không tìm thấy danh mục');
                    return window.location.href = contextPath + 'admin/categories/ajax/list';
                }
                $('#categoryName').val(c.categoryName || '');

                // Hiển thị ảnh hiện tại
                $('#currentImagePreview').html(
                    c.images
                        ? `<img src="${contextPath}admin/categories/images/${c.images}" 
                                class="img-thumbnail" style="max-width:200px; max-height:150px;">`
                        : `<span class="text-muted fst-italic">Chưa có hình ảnh</span>`
                );
            })
            .catch(err => {
                console.error('Load error:', err);
                alert('Lỗi tải dữ liệu: ' + err);
            });

        // Submit form cập nhật
        $('#updateCategoryForm').on('submit', function (e) {
            e.preventDefault();
            if (!this.checkValidity()) {
                e.stopPropagation();
                $(this).addClass('was-validated');
                return;
            }

            const formData = new FormData();
            formData.append('categoryName', $('#categoryName').val());
            const imageFile = $('#imageFile')[0].files[0];
            if (imageFile) formData.append('imageFile', imageFile);

            $.ajax({
                url: contextPath + 'admin/categories/api/updateWithFile/' + id,
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: response => {
                    if (response.status) {
                        alert('✅ Cập nhật thành công!');
                        window.location.href = contextPath + 'admin/categories/ajax/list';
                    } else {
                        alert('❌ Cập nhật thất bại: ' + (response.message || 'Unknown error'));
                    }
                },
                error: (xhr, status, error) => {
                    console.error('Update error:', error);
                    alert('Lỗi: ' + error);
                }
            });
        });
    });

    // Hàm gọi GraphQL
    function gqlRequest(query, variables) {
        return $.ajax({
            url: graphqlEndpoint,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query, variables: variables || {} })
        }).then(res => {
            if (res.errors) throw (res.errors[0]?.message || 'GraphQL error');
            return res.data;
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
