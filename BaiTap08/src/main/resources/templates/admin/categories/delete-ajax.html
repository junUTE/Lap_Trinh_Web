<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<head>
    <meta charset="UTF-8">
    <title>Xóa danh mục (AJAX + GraphQL)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var contextPath = /*[[@{/}]]*/ '/';
        if (contextPath && !contextPath.endsWith('/')) contextPath += '/';
        var graphqlEndpoint = contextPath + 'graphql';
        /*]]>*/
    </script>
</head>
<body>
<div layout:fragment="content" class="container py-4">

    <!-- Modal Delete Category -->
    <div class="modal fade" id="deleteCategoryModal" tabindex="-1" aria-labelledby="deleteCategoryLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-danger text-white">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <h5 class="modal-title mb-0" id="deleteCategoryLabel">Xác nhận xóa danh mục</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="fw-bold text-danger mb-3">
                        Bạn có chắc chắn muốn xóa danh mục này?
                    </p>
                    <div id="categoryInfo" class="mb-2 text-muted"></div>
                    <input type="hidden" id="delete_categoryid">
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-danger px-4" id="btnConfirmDelete">
                        <i class="fas fa-trash-alt me-1"></i> Xóa
                    </button>
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i> Hủy
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript">
    // Hàm gọi GraphQL chung
    function gqlRequest(query, variables) {
        return $.ajax({
            url: graphqlEndpoint,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query, variables: variables || {} })
        }).then(res => {
            if (res.errors) throw (res.errors[0]?.message || 'GraphQL error');
            return res.data;
        });
    }

    function goBackToList() {
        window.location.href = contextPath + 'admin/categories/ajax/list';
    }

    $(function () {
        const id = new URLSearchParams(window.location.search).get('id');
        if (!id) {
            alert('Thiếu tham số id');
            return goBackToList();
        }
        $('#delete_categoryid').val(id);

        // Load thông tin danh mục để confirm
        gqlRequest(`query($id: ID!){ categoryById(id: $id){ categoryId categoryName } }`, { id })
            .then(data => {
                const c = data?.categoryById;
                if (!c) {
                    $('#categoryInfo').text('Không tìm thấy danh mục');
                } else {
                    $('#categoryInfo').html(
                        `<span class="badge bg-dark">ID: ${c.categoryId}</span> - <b>${c.categoryName}</b>`
                    );
                }
            })
            .catch(err => console.error("Load error:", err));

        // Hiển thị modal ngay khi vào
        const delEl = document.getElementById('deleteCategoryModal');
        const modal = bootstrap.Modal.getInstance(delEl) || new bootstrap.Modal(delEl);
        modal.show();

        // Xử lý nút Xóa
        $('#btnConfirmDelete').on('click', function () {
            const idDel = $('#delete_categoryid').val();
            gqlRequest(`mutation($id: ID!){ deleteCategory(id: $id) }`, { id: idDel })
                .then(data => {
                    if (data?.deleteCategory === true) {
                        alert('✅ Xóa thành công!');
                        modal.hide();
                        goBackToList();
                    } else {
                        alert('❌ Xóa thất bại!');
                    }
                })
                .catch(err => alert('Lỗi: ' + err));
        });

        // Khi modal đóng thì quay về list
        $('#deleteCategoryModal').on('hidden.bs.modal', goBackToList);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
