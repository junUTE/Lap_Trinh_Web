<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin}">
<head>
    <meta charset="UTF-8">
    <title>Xóa người dùng (AJAX + GraphQL)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var contextPath = /*[[@{/}]]*/ '/';
        if (contextPath && !contextPath.endsWith('/')) { contextPath = contextPath + '/'; }
        var graphqlEndpoint = contextPath + 'graphql';
        /*]]>*/
    </script>
</head>
<body>
<div layout:fragment="content" class="container py-3">
    <!-- Modal Delete User -->
    <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-danger shadow-lg">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteUserLabel">
                        <i class="fas fa-triangle-exclamation me-2"></i>Xác nhận xóa người dùng
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <p class="fw-bold text-danger mb-2">Bạn có chắc chắn muốn xóa người dùng này?</p>
                    <div id="userInfo" class="mb-3 text-muted small fst-italic"></div>
                    <input type="hidden" id="delete_userid">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="btnConfirmDelete">
                        <i class="fas fa-trash me-1"></i> Xóa
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i> Hủy
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    var globalId = null;
    $(document).ready(function(){
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        if (!id) { 
            alert('Thiếu tham số id');
            return window.location.href = contextPath + 'admin/users/ajax/list';
        }
        globalId = id;
        $('#delete_userid').val(id);

        // Load thông tin user
        gqlRequest(`query($id: ID!){ userById(id: $id){ userId userName fullName email phone } }`, {id:id})
            .then(function(data){
                var u = data && data.userById;
                if (!u) { $('#userInfo').text('Không tìm thấy người dùng'); return; }
                $('#userInfo').html(
                    'ID: <b>' + u.userId + '</b> - ' +
                    (u.fullName || u.userName || '') + '<br>' +
                    '📧 ' + (u.email || '-') + ' | ☎ ' + (u.phone || '-')
                );
            })
            .catch(function(err){ console.error(err); });

        // Show modal
        try {
            var el = document.getElementById('deleteUserModal');
            var modal = bootstrap.Modal.getInstance(el) || new bootstrap.Modal(el);
            modal.show();
        } catch (e) {
            $('#deleteUserModal').modal('show');
        }

        // Xác nhận xóa
        $('#btnConfirmDelete').on('click', function(){
            gqlRequest(`mutation($id: ID!){ deleteUser(id: $id) }`, {id: globalId})
                .then(function(data){
                    if (data && data.deleteUser) {
                        alert('Đã xóa người dùng thành công');
                        window.location.href = contextPath + 'admin/users/ajax/list';
                    } else {
                        alert('Xóa thất bại');
                    }
                })
                .catch(function(err){ alert('Lỗi: ' + err); });
        });

        // Khi modal đóng thì quay về list
        $('#deleteUserModal').on('hidden.bs.modal', function () {
            window.location.href = contextPath + 'admin/users/ajax/list';
        });
    });

    function gqlRequest(query, variables) {
        return $.ajax({
            url: graphqlEndpoint,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query, variables: variables || {} })
        }).then(function (res) {
            if (res.errors) { throw (res.errors[0] && res.errors[0].message) || 'GraphQL error'; }
            return res.data;
        });
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
