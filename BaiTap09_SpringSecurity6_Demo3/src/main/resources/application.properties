spring.application.name=BaiTap09_SpringSecurity6_Demo3
server.port=8090

# Cấu hình kết nối cơ sở dữ liệu
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LTW_BT09_DEMO3;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Cấu hình thư mục lưu trữ file tải lên
storage.location=E:/upload

# Cấu hình email
spring.mail.host=smtp.gmail.com
spring.mail.port=587

#Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML