<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/home}">
<section class="row" layout:fragment="content">
    <div class="col-md-8 offset-md-2 mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" th:text="${product.productId} != null ? 'Edit Product' : 'Add Product'"></h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/products/save}" th:object="${product}"
                      method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{productId}" />
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" th:field="*{productName}" class="form-control" placeholder="Enter product name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" th:field="*{quantity}" class="form-control" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Unit Price</label>
                        <input type="number" th:field="*{unitPrice}" class="form-control" min="0" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Discount (%)</label>
                        <input type="number" th:field="*{discount}" class="form-control" min="0" max="100" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Enter description"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select th:field="*{status}" class="form-select">
                            <option th:value="1" th:text="'Active'"></option>
                            <option th:value="0" th:text="'Inactive'"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="categoryId" class="form-select" required>
                            <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryName}" th:selected="${product.category != null and product.category.categoryId == cat.categoryId}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Image</label>
                        <input type="file" name="imageFile" class="form-control" accept="image/*">
                        <div th:if="${product.images != null}">
                            <p>Current image:</p>
                            <img th:src="@{${product.images}}" alt="image" style="max-width: 120px; max-height: 120px;"/>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/admin/products}" class="btn btn-secondary">
                            <i class="fa fa-arrow-left"></i> Back
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fa fa-save"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
</html>
