<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/home}">

<!-- Nội dung chính -->
<section class="row" layout:fragment="content">
  <div class="col mt-4">
    <div class="mb-3">
      <a href="/admin/categories/ajax/list" class="btn btn-outline-primary">
        <i class="fa fa-folder"></i> Go to Category List
      </a>
    </div>

    <div class="card shadow">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">📦 Product List</h5>
        <a href="/admin/products/ajax/add" class="btn btn-primary">
          <i class="fa fa-plus"></i> Add Product
        </a>
      </div>

      <div class="card-body">
        <div id="messageBox" class="alert alert-success d-none" role="alert"></div>

        <table class="table table-hover table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th style="width: 60px;">#</th>
              <th style="width: 120px;">Image</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Quantity</th>
              <th>Unit Price</th>
              <th>Discount (%)</th>
              <th>Status</th>
              <th style="width: 180px;">Actions</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <!-- Data will be loaded by AJAX -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- Script riêng -->
<div layout:fragment="scripts">
  <script th:inline="javascript">
    console.log("JS for Product List loaded");

    function fetchProducts() {
      fetch('/admin/products/api')
        .then(response => response.json())
        .then(products => {
          const tbody = document.getElementById('productTableBody');
          tbody.innerHTML = '';
          if (!products || products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">No products found</td></tr>';
            return;
          }
          products.forEach((p, idx) => {
            const imageHtml = p.images
              ? `<img src="${p.images}" alt="image" class="img-thumbnail" style="max-height: 60px;">`
              : '<span class="text-muted">No Image</span>';
            const categoryName = p.category && p.category.categoryName ? p.category.categoryName : 'N/A';
            const statusHtml = p.status == 1
              ? '<span class="badge bg-success">Active</span>'
              : '<span class="badge bg-secondary">Inactive</span>';
            tbody.innerHTML += `
              <tr>
                <td>${idx + 1}</td>
                <td>${imageHtml}</td>
                <td>${p.productName}</td>
                <td>${categoryName}</td>
                <td>${p.quantity}</td>
                <td>${p.unitPrice}</td>
                <td>${p.discount}</td>
                <td>${statusHtml}</td>
                <td>
                  <a href="/admin/products/ajax/update?id=${p.productId}" class="btn btn-sm btn-warning">
                    <i class="fa fa-edit"></i>
                  </a>
                  <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.productId})">
                    <i class="fa fa-trash"></i>
                  </button>
                </td>
              </tr>`;
          });
        })
        .catch(err => {
          console.error("Error fetching products:", err);
          document.getElementById('productTableBody').innerHTML =
            '<tr><td colspan="9" class="text-center text-danger">Failed to load products</td></tr>';
        });
    }

    function deleteProduct(id) {
      if (!confirm('Are you sure to delete this product?')) return;
      fetch(`/admin/products/api/${id}`, { method: 'DELETE' })
        .then(response => {
          if (response.ok) {
            showMessage('Product deleted successfully!');
            fetchProducts();
          } else {
            response.text().then(msg => showMessage(msg || 'Delete failed', true));
          }
        })
        .catch(() => showMessage('Delete failed', true));
    }

    function showMessage(msg, isError) {
      const box = document.getElementById('messageBox');
      box.textContent = msg;
      box.classList.remove('d-none', 'alert-success', 'alert-danger');
      box.classList.add(isError ? 'alert-danger' : 'alert-success');
      setTimeout(() => box.classList.add('d-none'), 3000);
    }

    document.addEventListener('DOMContentLoaded', fetchProducts);
  </script>
</div>

</html>
