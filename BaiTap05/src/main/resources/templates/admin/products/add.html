<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/home}">

<section class="row" layout:fragment="content">
	<div class="col-md-8 offset-md-2 mt-4">
		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h5 class="mb-0">Add Product</h5>
			</div>
			<div class="card-body">
				<div id="messageBox" class="alert d-none" role="alert"></div>
				<form id="productForm" enctype="multipart/form-data">
					<div class="mb-3">
						<label class="form-label">Product Name</label>
						<input type="text" name="productName" class="form-control" required>
					</div>
					<div class="mb-3">
						<label class="form-label">Quantity</label>
						<input type="number" name="quantity" class="form-control" required min="0">
					</div>
					<div class="mb-3">
						<label class="form-label">Unit Price</label>
						<input type="number" name="unitPrice" class="form-control" required min="0" step="0.01">
					</div>
					<div class="mb-3">
						<label class="form-label">Discount (%)</label>
						<input type="number" name="discount" class="form-control" required min="0" max="100"
							step="0.01">
					</div>
					<div class="mb-3">
						<label class="form-label">Status</label>
						<select name="status" class="form-select" required>
							<option value="1">Active</option>
							<option value="0">Inactive</option>
						</select>
					</div>
					<div class="mb-3">
						<label class="form-label">Category</label>
						<select id="categoryId" name="categoryId" class="form-select" required>
							<option value="">-- Select Category --</option>
						</select>
					</div>
					<div class="mb-3">
						<label class="form-label">Description</label>
						<textarea name="description" class="form-control" required></textarea>
					</div>
					<div class="mb-3">
						<label class="form-label">Image</label>
						<input type="file" name="image" class="form-control" accept="image/*">
					</div>
					<div class="d-flex justify-content-between">
						<a href="/admin/products/ajax/list" class="btn btn-secondary">
							<i class="fa fa-arrow-left"></i> Back
						</a>
						<button type="submit" class="btn btn-success">
							<i class="fa fa-save"></i> Save
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</section>

<div layout:fragment="scripts">
	<script th:inline="javascript">
		function showMessage(msg, isError) {
			const box = document.getElementById('messageBox');
			box.textContent = msg;
			box.classList.remove('d-none', 'alert-success', 'alert-danger');
			box.classList.add(isError ? 'alert-danger' : 'alert-success');
			setTimeout(() => box.classList.add('d-none'), 3000);
		}

		function loadCategories() {
			fetch('/admin/categories/api')
				.then(res => res.json())
				.then(categories => {
					console.log("Loaded categories:", categories);
					const select = document.getElementById('categoryId');
					select.innerHTML = '<option value="">-- Select Category --</option>';
					categories.forEach(cat => {
						select.innerHTML += `<option value="${cat.categoryId}">${cat.categoryName}</option>`;
					});
				})
				.catch(err => {
					console.error("Error loading categories", err);
					showMessage("Failed to load categories", true);
				});
		}

		document.addEventListener('DOMContentLoaded', function () {
			loadCategories();
			document.getElementById('productForm').addEventListener('submit', function (e) {
				e.preventDefault();
				const formData = new FormData(e.target);
				fetch('/admin/products/api', {
					method: 'POST',
					body: formData
				})
					.then(res => {
						if (!res.ok) return res.text().then(msg => {throw new Error(msg);});
						return res.json();
					})
					.then(() => {
						window.location.href = '/admin/products/ajax/list';
					})
					.catch(err => showMessage(err.message || 'Save failed', true));
			});
		});
	</script>
</div>

</html>
