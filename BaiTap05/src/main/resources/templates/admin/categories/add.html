<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/home}">

<section class="row" layout:fragment="content">
    <div class="col-md-6 offset-md-3 mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Add Category</h5>
            </div>
            <div class="card-body">
                <div id="messageBox" class="alert d-none" role="alert"></div>
                <form id="categoryForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Category Name</label>
                        <input type="text" name="categoryName" class="form-control"
                               placeholder="Enter category name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Icon</label>
                        <input type="file" name="icon" class="form-control" accept="image/*">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/admin/categories/ajax/list" class="btn btn-secondary">
                            <i class="fa fa-arrow-left"></i> Back
                        </a>
                        <button type="submit" class="btn btn-success">
                            <i class="fa fa-save"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Script riêng -->
<div layout:fragment="scripts">
<script th:inline="javascript">
function showMessage(msg, isError) {
    const box = document.getElementById('messageBox');
    box.textContent = msg;
    box.classList.remove('d-none', 'alert-success', 'alert-danger');
    box.classList.add(isError ? 'alert-danger' : 'alert-success');
    setTimeout(() => box.classList.add('d-none'), 3000);
}

document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('categoryForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        fetch('/admin/categories/api', {
            method: 'POST',
            body: formData
        })
        .then(res => {
            if (!res.ok) return res.text().then(msg => { throw new Error(msg); });
            return res.json();
        })
        .then(() => {
            window.location.href = '/admin/categories/ajax/list';
        })
        .catch(err => showMessage(err.message || 'Save failed', true));
    });
});
</script>
</div>

</html>
