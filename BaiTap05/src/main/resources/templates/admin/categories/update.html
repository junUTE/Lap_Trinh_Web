<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/home}">
<section class="row" layout:fragment="content">
	<div class="col-md-6 offset-md-3 mt-4">
		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h5 class="mb-0">Edit Category</h5>
			</div>
			<div class="card-body">
				<div id="messageBox" class="alert d-none" role="alert"></div>
				<form id="categoryForm" enctype="multipart/form-data">
					<input type="hidden" id="categoryId" name="categoryId" />
					<div class="mb-3">
						<label class="form-label">Category Name</label>
						<input type="text" id="categoryName" name="categoryName" class="form-control"
							placeholder="Enter category name" required>
					</div>
					<div class="mb-3">
						<label class="form-label">Icon</label>
						<input type="file" id="iconFile" name="icon" class="form-control" accept="image/*">
						<div id="currentIconBox" class="mt-2 d-none">
							<p>Current icon:</p>
							<img id="currentIconImg" src="#" alt="icon" style="max-width: 100px; max-height: 100px;" />
						</div>
					</div>
					<div class="d-flex justify-content-between">
						<a href="/admin/categories" class="btn btn-secondary">
							<i class="fa fa-arrow-left"></i> Back
						</a>
						<button type="submit" class="btn btn-success">
							<i class="fa fa-save"></i> Save
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</section>
<script>
	function getQueryParam(name) {
		const url = new URL(window.location.href);
		return url.searchParams.get(name);
	}

	function showMessage(msg, isError) {
		const box = document.getElementById('messageBox');
		box.textContent = msg;
		box.classList.remove('d-none', 'alert-success', 'alert-danger');
		box.classList.add(isError ? 'alert-danger' : 'alert-success');
		setTimeout(() => box.classList.add('d-none'), 3000);
	}

	function loadCategory(id) {
		fetch(`/api/categories/${id}`)
			.then(res => {
				if (!res.ok) throw new Error('Not found');
				return res.json();
			})
			.then(category => {
				document.getElementById('categoryId').value = category.categoryId;
				document.getElementById('categoryName').value = category.categoryName;
				if (category.icon) {
					document.getElementById('currentIconImg').src = '/uploads/' + category.icon;
					document.getElementById('currentIconBox').classList.remove('d-none');
				}
			})
			.catch(() => showMessage('Failed to load category', true));
	}

	document.addEventListener('DOMContentLoaded', function () {
		const categoryId = getQueryParam('id');
		if (categoryId) {
			loadCategory(categoryId);
		} else {
			showMessage('No category ID provided', true);
		}
		document.getElementById('categoryForm').addEventListener('submit', function (e) {
			e.preventDefault();
			const form = e.target;
			const formData = new FormData(form);
			if (!form.categoryId.value) {
				showMessage('Missing category ID', true);
				return;
			}
			fetch(`/api/categories/${form.categoryId.value}`, {
				method: 'PUT',
				body: formData
			})
				.then(res => {
					if (!res.ok) return res.text().then(msg => {throw new Error(msg);});
					return res.json();
				})
				.then(() => {
					window.location.href = '/admin/categories';
				})
				.catch(err => showMessage(err.message || 'Save failed', true));
		});
	});
</script>

</html>
