<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/home}">
<section class="row" layout:fragment="content">
    <div class="col mt-4">
        <div class="card">
            <div class="card-header">Search Category</div>
            <div class="card-body">
                <form th:action="@{/admin/categories/searchpaginated}" method="get" class="mb-3">
                    <div class="input-group">
                        <input type="text" name="name" class="form-control" th:value="${name}" placeholder="Nhập từ khóa..."/>
                        <button class="btn btn-outline-primary">Search</button>
                    </div>
                </form>
                <table class="table table-striped table-responsive" th:if="${categoryPage.hasContent()}">
                    <thead>
                    <tr>
                        <th>Category ID</th>
                        <th>Category Name</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category : ${categoryPage.content}">
                        <td>[[${category.categoryId}]]</td>
                        <td th:text="${category.name}"></td>
                        <td>
                            <a th:href="@{'/admin/categories/edit/' + ${category.categoryId}}"
                               class="btn btn-outline-warning"><i class="fa fa-edit"></i></a>
                            <a th:href="@{'/admin/categories/delete/' + ${category.categoryId}}"
                               class="btn btn-outline-danger"><i class="fa fa-trash"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- Phân trang -->
                <nav th:if="${categoryPage.totalPages > 1}" class="mt-3">
                    <ul class="pagination justify-content-center">
                        <li th:class="${1 == categoryPage.number + 1} ? 'page-item active' : 'page-item'">
                            <a class="page-link" th:href="@{/admin/categories/searchpaginated(page=1, size=${categoryPage.size}, name=${name})}">First</a>
                        </li>
                        <li th:each="pageNumber : ${pageNumbers}" th:class="${pageNumber == categoryPage.number + 1} ? 'page-item active' : 'page-item'">
                            <a class="page-link"
                               th:href="@{/admin/categories/searchpaginated(page=${pageNumber}, size=${categoryPage.size}, name=${name})}"
                               th:text="${pageNumber}">1</a>
                        </li>
                        <li th:class="${categoryPage.totalPages == categoryPage.number + 1} ? 'page-item active' : 'page-item'">
                            <a class="page-link" th:href="@{/admin/categories/searchpaginated(page=${categoryPage.totalPages}, size=${categoryPage.size}, name=${name})}">Last</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</section>
</html>
