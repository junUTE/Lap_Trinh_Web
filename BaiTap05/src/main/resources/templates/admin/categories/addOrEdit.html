<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/home}">
<section class="row" layout:fragment="content">
	<div class="col-md-6 offset-md-3 mt-4">
		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h5 class="mb-0"
					th:text="${category.categoryId} != null ? 'Edit Category' : 'Add Category'">
				</h5>
			</div>
			<div class="card-body">
				<form th:action="@{/admin/categories/save}" th:object="${category}"
					method="post" enctype="multipart/form-data">
					<input type="hidden" th:field="*{categoryId}" />

					<div class="mb-3">
						<label class="form-label">Category Name</label> <input type="text"
							th:field="*{categoryName}" class="form-control"
							placeholder="Enter category name" required>
					</div>

					<div class="mb-3">
						<label class="form-label">Icon</label> <input type="file"
							name="iconFile" class="form-control" accept="image/*">
						<!-- Show current icon if editing -->
						<div th:if="${category.icon != null}">
							<p>Current icon:</p> <img th:src="@{${category.icon}}"
							alt="icon"
							style="max-width: 100px; max-height: 100px;" />
						</div>
					</div>

					<div class="d-flex justify-content-between">
						<a th:href="@{/admin/categories}" class="btn btn-secondary">
							<i class="fa fa-arrow-left"></i> Back
						</a>
						<button type="submit" class="btn btn-success">
							<i class="fa fa-save"></i> Save
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</section>
</html>
